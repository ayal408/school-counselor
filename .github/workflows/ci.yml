name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r counselor-server/requirements.txt
      - run: python -m pytest counselor-server/tests auth-server/tests -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: counselor-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: counselor-client/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
  local-transcription:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r local-transcription/requirements.txt httpx pytest
      - run: python -m pytest local-transcription/tests -q
