limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ai:10m rate=3r/m;
server {
 listen 80;
 server_tokens off;
 root /usr/share/nginx/html;
 client_max_body_size 1m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location = /api/email/gmail/callback {
  access_log off;
  proxy_pass http://counselor-server:8080;
  proxy_set_header Host $host;
 }
 location /api/account/ {
  limit_req zone=auth burst=5 nodelay;
  limit_req_status 429;
  proxy_pass http://counselor-server:8080;
 }
 location /api/email/gmail/ {
  limit_req zone=ai burst=3 nodelay;
  limit_req_status 429;
  proxy_pass http://counselor-server:8080;
 }
 location = /api/email/send-test {
  limit_req zone=ai burst=3 nodelay;
  limit_req_status 429;
  proxy_pass http://counselor-server:8080;
 }
 location /api/auth/ {
  limit_req zone=auth burst=10 nodelay;
  limit_req_status 429;
  proxy_pass http://auth-server:5000;
  proxy_set_header Host $host;
 }
 location /api/ai/students/ {
  limit_req zone=ai burst=3 nodelay;
  limit_req_status 429;
  client_max_body_size 20m;
  client_body_buffer_size 20m;
  proxy_request_buffering off;
  proxy_read_timeout 180s;
  proxy_send_timeout 180s;
  proxy_pass http://counselor-server:8080;
  proxy_set_header Host $host;
 }
 location /api/settings/backup/ {
  limit_req zone=ai burst=2 nodelay;
  limit_req_status 429;
  client_max_body_size 20m;
  client_body_buffer_size 20m;
  proxy_request_buffering off;
  proxy_read_timeout 180s;
  proxy_pass http://counselor-server:8080;
  proxy_set_header Host $host;
 }
 location /api/settings/ai/ {
  limit_req zone=ai burst=3 nodelay;
  limit_req_status 429;
  proxy_pass http://counselor-server:8080;
 }
 location /api/ { proxy_pass http://counselor-server:8080; proxy_set_header Host $host; }
 location /internal/ { return 404; }
 location / { try_files $uri $uri/ /index.html; }
}
