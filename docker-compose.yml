services:
  nginx-gateway:
    build:
      context: .
      dockerfile: counselor-client/Dockerfile
    ports: ["8088:80"]
    depends_on: [auth-server, counselor-server]
  auth-server:
    build: ./auth-server
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY}
      DATA_SERVICE_URL: http://counselor-server:8080
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8088}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on: [counselor-server]
  counselor-server:
    build: ./counselor-server
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8080 --no-access-log"]
    environment: &counselor-environment
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8088}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_EMAIL: ${GMAIL_EMAIL:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_TRANSCRIPTION_MODEL: ${GROQ_TRANSCRIPTION_MODEL:-whisper-large-v3}
      GROQ_SUMMARY_MODEL: ${GROQ_SUMMARY_MODEL:-openai/gpt-oss-120b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-whisper-1}
      OPENAI_SUMMARY_MODEL: ${OPENAI_SUMMARY_MODEL:-gpt-4.1-mini}
      DATABASE_URL: postgresql+psycopg://counselor:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/counselor
    depends_on:
      postgres:
        condition: service_healthy
  email-worker:
    build: ./counselor-server
    command: ["python", "-m", "app.email_worker"]
    environment: *counselor-environment
    depends_on: [counselor-server]
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: counselor
      POSTGRES_USER: counselor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counselor -d counselor"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:

